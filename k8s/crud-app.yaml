apiVersion: apps/v1
kind: Deployment
metadata:
  name: crud-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crud-app
  template:
    metadata:
      labels:
        app: crud-app
    spec:
      containers:
        - name: app
          image: us-central1-docker.pkg.dev/cloudfinalproject-494714/apps/crud-app:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crud-db-secret
                  key: DB_PASSWORD
            - name: DATABASE_URL
              value: "mysql+pymysql://notes_user:$(DB_PASSWORD)@34.59.237.72:3306/notes_app"
            - name: SKIP_DB_INIT
              value: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: crud-app-service
spec:
  type: LoadBalancer
  selector:
    app: crud-app
  ports:
    - port: 80
      targetPort: 8080
