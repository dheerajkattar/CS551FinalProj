apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-api-config
data:
  GEMINI_MODEL: gemini-1.5-flash-latest
  GEMINI_REQUEST_TIMEOUT_SECONDS: "20"
  RATE_LIMIT_RPM: "30"
  CHAT_CONTEXT_MESSAGES: "5"
  REDIS_KEY_PREFIX: llm
  REDIS_TIMEOUT_SECONDS: "2"
  REDIS_SESSION_TTL_SECONDS: "86400"
  UVICORN_WORKERS: "2"
  PORT: "5003"
  LOG_LEVEL: INFO
