apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-api
  template:
    metadata:
      labels:
        app: llm-api
    spec:
      serviceAccountName: llm-api
      containers:
        - name: llm-api
          image: ghcr.io/example/cs551-llm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5003
              name: http
          envFrom:
            - configMapRef:
                name: llm-api-config
            - secretRef:
                name: llm-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
