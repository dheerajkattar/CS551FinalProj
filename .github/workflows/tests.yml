name: Test Suite

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  tests:
    name: Non-slow tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r Applications/CRUD_APP/requirements.txt
          pip install -r Applications/CPU_APP/requirements.txt
          pip install -r Applications/QUEUE_APP/requirements.txt
          pip install -r Applications/LLM_APP/requirements.txt

      - name: Run tests with coverage gate
        run: pytest

  slow-tests:
    name: Slow tests (weekly/manual)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r Applications/CRUD_APP/requirements.txt
          pip install -r Applications/CPU_APP/requirements.txt
          pip install -r Applications/QUEUE_APP/requirements.txt
          pip install -r Applications/LLM_APP/requirements.txt

      - name: Run slow tests only
        run: pytest -m "slow" --cov=Applications --cov-report=term-missing --cov-fail-under=0
