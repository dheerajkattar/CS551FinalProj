[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --strict-config --cov=Applications --cov-report=term-missing --cov-fail-under=70 -m "not slow"
markers =
    unit: fast unit-level tests
    api: API integration tests using framework test clients
    asyncmock: tests that mock async/external systems (Celery, Redis, LLM APIs)
    slow: long-running or benchmark-style tests, excluded from default runs
filterwarnings =
    ignore::DeprecationWarning
